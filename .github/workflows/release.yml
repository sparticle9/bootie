name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: verify-build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest-known"
          require-checksums: true
          python-version: "3.12"
          # The only Python dependency is small; avoid cache storage and API overhead.
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Verify runner ShellCheck
        # Included in the GitHub-hosted Ubuntu image; do not run apt in CI.
        run: shellcheck --version

      - name: Verify generated artifact is not tracked
        run: |
          if git ls-files --error-unmatch bootie.sh >/dev/null 2>&1; then
            echo "bootie.sh is a generated release artifact and must not be tracked" >&2
            exit 1
          fi

      - name: Check shell syntax
        run: |
          set -eu
          for f in bootie-main engine/*.sh scripts/test-bundle; do
            dash -n "$f"
          done
          bash -n scripts/bundle payload/om-desktop

      - name: Run shellcheck
        run: |
          shellcheck -S info -s sh bootie-main engine/*.sh scripts/test-bundle
          shellcheck -S info -s bash scripts/bundle payload/om-desktop

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q engine tests

      - name: Run unit tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Run bundle smoke tests
        run: uv run --locked sh scripts/test-bundle

      - name: Build release artifact
        run: |
          mkdir -p dist
          uv run --locked bash scripts/bundle dist/bootie.sh

      - name: Verify release artifact execution modes
        run: |
          file_version=$(sh dist/bootie.sh version)
          pipe_version=$(cat dist/bootie.sh | sh -s version)
          [ -n "$file_version" ]
          [ "$file_version" = "$pipe_version" ]
          echo "verified file-mode and pipe-mode execution: $file_version"

      - name: Generate and verify checksums
        run: |
          (cd dist && sha256sum bootie.sh > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Attest bootie.sh build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/bootie.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/bootie.sh dist/SHA256SUMS \
            --title "$tag" \
            --verify-tag \
            --generate-notes
