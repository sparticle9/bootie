# Opinionated example: Ubuntu 26.04 LTS desktop on the official resolute cloud
# qcow2 image.
#
# The desktop package set is installed noninteractively with apt-get in the
# target chroot during personalization; it is not a graphical installer flow.
# `ubuntu-desktop-minimal` is large, so use this only where the target has
# reliable outbound connectivity and enough disk/memory headroom.
#
# No credentials, private hostnames, or network enrollment tokens are embedded
# here.
#
# Example profile — not yet end-to-end drill-validated.
manifest_version: 2
name: ubuntu
version: "26.04"
arch: x86_64
x-codename: resolute
x-status: implemented-not-drill-proven
x-example: desktop-cloud-image

artifact:
  kind: disk-image
  checksums_url: https://cloud-images.ubuntu.com/resolute/current/SHA256SUMS
  image_file: resolute-server-cloudimg-amd64.img
  checksum_alg: sha256
  requires:
    arch: x86_64
    min_size_gib: 8

target:
  disk_min_size_gib: 25
  memory_min_mib: 4096
  firmware: [bios, uefi]

liveenv:
  kind: debian-initramfs
  packages:
    - busybox-static
    - dropbear-initramfs
    - openssh-client
    - curl
    - qemu-utils
    - qemu-block-extra
    - e2fsprogs
    - dosfstools
    - fdisk
    - gdisk
  kernel_cmdline: "break=mount console=ttyS0,115200 console=tty0"
  ssh_port: 22
  mode: auto

write:
  method: qemu-img-stream
  scrub_after: false

personalize:
  rootfs: ext4
  network: netplan
  ssh_host_keys: pregenerate
  bios_boot: image-native
  connectivity_host: archive.ubuntu.com
  late_commands: []

firstboot:
  grow_partition: true
  btrfs_resize: false

cloud_config:
  users:
    - name: ubuntu
      groups: [sudo]
      shell: /bin/bash
      sudo: "ALL=(ALL) NOPASSWD: ALL"
      lock_passwd: true
      ssh_authorized_keys: []
  packages:
    - ubuntu-desktop-minimal
  package_update: true

postinstall:
  managed_user: ubuntu
  boot_target: desktop
  install_om_desktop: false
